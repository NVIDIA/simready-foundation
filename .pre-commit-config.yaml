# Pre-commit hooks for the SimReady Foundation repo.
#
# Install once:   pip install pre-commit && pre-commit install
# Run on demand:  pre-commit run --all-files
#
# Hook revs are pinned; bump them intentionally (e.g. via `pre-commit autoupdate`).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # Lint only. Configuration lives in ruff.toml. Formatting, import order,
      # and license headers are owned by `./repo.sh format`, so the ruff-format
      # hook is intentionally NOT enabled here (it would fight black @ 120).
      - id: ruff-check
        args: [--fix]
