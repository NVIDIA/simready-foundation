name: Create Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 8 * * *" # midnight PST / 8:00 UTC daily
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v2026.04.0). Created from HEAD if it doesn't exist yet."
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-for-changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Check for commits since last nightly tag
        id: check
        run: |
          LAST_NIGHTLY=$(git tag -l 'nightly-*' --sort=-creatordate | head -1)
          if [[ -z "$LAST_NIGHTLY" ]]; then
            echo "No previous nightly tag found — first nightly release"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(git rev-parse "$LAST_NIGHTLY")" == "$(git rev-parse HEAD)" ]]; then
            echo "HEAD unchanged since $LAST_NIGHTLY — skipping"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits since $LAST_NIGHTLY"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    runs-on: ubuntu-latest
    needs: [check-for-changes]
    if: |
      always() &&
      (needs.check-for-changes.result == 'skipped' || needs.check-for-changes.outputs.has_changes == 'true')
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Determine version tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            TAG="nightly-$(date -u +%Y%m%d)"
            VERSION="nightly-$(date -u +%Y%m%d)"
            IS_NIGHTLY=true
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
            VERSION="${TAG#v}"
            IS_NIGHTLY=false
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            IS_NIGHTLY=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$IS_NIGHTLY" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create tag if missing
        if: github.event_name == 'schedule' || inputs.tag_name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          else
            echo "Tag $TAG already exists"
          fi

      - name: Zip repository
        run: |
          ARCHIVE="simready-foundation-${{ steps.meta.outputs.version }}.zip"
          git archive --format=zip --prefix="simready-foundation-${{ steps.meta.outputs.version }}/" \
            -o "$ARCHIVE" HEAD
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "Created $ARCHIVE ($(du -h "$ARCHIVE" | cut -f1))"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          PRERELEASE_FLAG=""
          if [[ "${{ steps.meta.outputs.is_nightly }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" "$ARCHIVE" \
            --repo "${{ github.repository }}" \
            --title "SimReady Foundation ${{ steps.meta.outputs.version }}" \
            --generate-notes \
            $PRERELEASE_FLAG
