interface:
  display_name: "SimReady Conform FET010_DisplayColor"
  short_description: "Repair FET010_DisplayColor conformance by deriving display colour from the bound material"
  default_prompt: "Use $simready-foundation-conform-fet-010-standard to repair FET010_DisplayColor SimReady conformance failures. The bundled author_display_color.py derives a constant primvars:displayColor per renderable Gprim from the bound material's base colour, sampling a base colour map only where the geometry lands on it and averaging in linear light; pass --verify to report DISP.001, DISP.002 and DISP.003 without editing. --no-textures derives from material constants alone, which on the current samples means almost nothing is authored, so install numpy and Pillow and sample the maps."
