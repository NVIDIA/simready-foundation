[project]
name = "simready-foundation-tier-template"
version = "2026.10.0-rc2"
description = "SimReady Foundation template tier: copy this package to start a new additive validation tier"
authors = [
    {name = "NVIDIA"},
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "usd-validation-nvidia>=1.20.0",
    "numpy",
    "simready-foundation-tier-core>=2026.10.0-rc2",
]

# Framework discovery: the asset validator / usd-validation auto-discovers this
# tier's validators (rules + their requirements) through its own plugin group.
[project.entry-points."usd_validation_nvidia"]
simready-validate-tier-template = "simready.foundation.tier_template:SimReadyPlugin"

# SimReady tier discovery: the SimReady loader enumerates this (deliberately
# non-validation-specific) group to find installed tiers and their per-layer
# content sources (requirements module + features/profiles dirs).
[project.entry-points."simready.tier"]
tier_template = "simready.foundation.tier_template:tier"

[project.urls]
Documentation = "https://nvidia.github.io/simready-foundation/"

[project.optional-dependencies]
usd = ["usd-core>=22.11"]
test = ["pytest"]

# This tier's package lives committed under ./simready/foundation/... and ships
# as-is. The ONLY build step is generating the requirements-enum module from the
# committed capability markdown; the shared hook reads `module`/`reverse_domain`
# below to know what to generate and where.
[tool.hatch.build.hooks.custom]
path = "../_tooling/build_hook.py"
module = "simready.foundation.tier_template"
reverse_domain = "com.nvidia.simready"
package_licenses = [
    "numpy-LICENSE.txt",
    "usd-validation-nvidia-LICENSE.txt",
    "usd-validation-nvidia-THIRD_PARTY_NOTICES.md",
    "usd-core-LICENSE.txt",
]

# Ship the committed package tree. __pycache__ and the generated
# requirements/ are skipped via this directory's own .gitignore, which is where
# hatchling looks for VCS ignores -- the repo-root .gitignore is not consulted.
[tool.hatch.build.targets.wheel]
packages = ["simready"]

# ...and add the build-time generated requirements enums.
[tool.hatch.build.targets.wheel.force-include]
"_build/python/simready/foundation/tier_template/requirements" = "simready/foundation/tier_template/requirements"

[build-system]
# The shared build hook (../_tooling/build_hook.py) generates this tier's
# requirements enums at build time, so the codegen package must be importable in
# the (isolated) build env.
requires = ["hatchling>=1.27", "usd-profiles-nvidia"]
build-backend = "hatchling.build"
