reason = "com.nvidia.usd.VM.BIND.001 and com.nvidia.usd.VM.MDL.002 are removed. SimReady registered VM.MDL.002 and never reported it, so handing the code upstream turned an inert requirement into a live one and began failing assets on the deprecated MDL schema that this version had shipped without checking. Removing them restores what 0.1.0 asked for. FET_006_MDL 0.2.0 carries both."
